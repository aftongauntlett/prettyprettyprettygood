name: Accessibility

on:
  pull_request:
    paths:
      - src/**
      - public/**
      - scripts/**
      - package.json
      - astro.config.mjs
      - .github/workflows/accessibility.yml
  workflow_dispatch:

jobs:
  lighthouse-mobile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > preview.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4321 > /dev/null; then
              echo "Preview server is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Preview server failed to start"
          cat preview.log
          exit 1

      - name: Run accessibility audit (mobile)
        run: npm run a11y:check -- http://127.0.0.1:4321/

  lighthouse-desktop:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > preview.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4321 > /dev/null; then
              echo "Preview server is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Preview server failed to start"
          cat preview.log
          exit 1

      - name: Run accessibility audit (desktop)
        run: npm run a11y:check -- http://127.0.0.1:4321/ --preset=desktop
